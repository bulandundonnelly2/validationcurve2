name: Validation Curve Route Tests
on:
  push:
    paths:
      - 'route-engine.js'
      - 'tests/**'
      - 'api/assess.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/route-tests.yml'
  pull_request:
    paths:
      - 'route-engine.js'
      - 'tests/**'
      - 'api/assess.js'
      - 'index.html'
      - 'package.json'
jobs:
  route-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run route tests
        run: npm test
